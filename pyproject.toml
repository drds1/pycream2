[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pycream2"
version = "0.1.0"
description = "Continuum Reprocessing AGN MCMC: Bayesian fitting of AGN accretion-disc reverberation light curves with JAX and NumPyro"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "David Starkey" }]
keywords = ["AGN", "reverberation mapping", "accretion disc", "CREAM", "MCMC", "Bayesian inference", "JAX", "NumPyro", "astrophysics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Physics",
]

dependencies = [
    # Capped, not just floored: an unconstrained jax/jaxlib range can
    # resolve to a version with no published wheel for a given platform
    # (hit this directly with `poetry install` resolving to jaxlib 0.10.2,
    # which has no compatible wheel on this machine) -- 0.4.x is the line
    # this codebase is developed and tested against.
    "jax>=0.4.28,<0.5",
    "jaxlib>=0.4.28,<0.5",
    "numpyro>=0.15.0",
    "numpy>=1.24",
    "matplotlib>=3.7",
    "arviz>=0.17",
    "h5netcdf>=1.0",
    "h5py>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov>=4.0", "pre-commit>=3.5", "jupyter", "ipykernel", "Pillow"]

# Documentation site build (mkdocs.yml): `poetry install --with docs`. A Poetry
# group rather than an extra, so it never appears in the published package's
# metadata. MkDocs 2.0 drops the plugin system mkdocstrings needs, so stay on 1.x.
[tool.poetry.group.docs]
optional = true

[tool.poetry.group.docs.dependencies]
mkdocs = ">=1.6,<2"
mkdocs-material = ">=9.5,<10"
mkdocstrings = {version = ">=0.26,<1", extras = ["python"]}
ruff = "*"  # lets mkdocstrings format long signatures

# Kaggle CLI, for running long fits on Kaggle's free notebooks (push a notebook,
# download its output): `poetry install --with remote`. Optional, never needed
# to use or test the package.
[tool.poetry.group.remote]
optional = true

[tool.poetry.group.remote.dependencies]
kaggle = ">=1.6"

[project.urls]
Homepage = "https://github.com/drds1/pycream2"
Documentation = "https://drds1.github.io/pycream2/"
Repository = "https://github.com/drds1/pycream2"
Issues = "https://github.com/drds1/pycream2/issues"
"Original CREAM (pycecream)" = "https://github.com/drds1/pycecream"

[tool.setuptools.packages.find]
include = ["pycream2*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: full/multi-chain MCMC recovery tests -- excluded from the pre-commit hook's quick pass (`pytest -m \"not slow\"`), run in full by CI and `poetry run pytest` with no marker filter.",
]

[tool.coverage.run]
source = ["pycream2"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]
